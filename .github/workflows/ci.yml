name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests (statistical helpers, multiplicity, AI guardrail)
        run: python tests/test_experiment_stats.py

      - name: Warehouse tests (dbt vs plain-SQL parity, mart invariants)
        run: python tests/test_warehouse_parity.py

      # MUST run before the pipeline: it checks the COMMITTED README and memo
      # against the COMMITTED metrics.json, and the pipeline overwrites all three.
      # Running it afterwards would only compare fresh output against itself.
      - name: Reports in sync with committed metrics
        run: python tests/test_reports_in_sync.py

      # The end-to-end run is the real test: it rebuilds the warehouse with dbt
      # (including dbt data tests), recomputes every estimate, and regenerates
      # the memo and the README results block. No API key is set, so the AI
      # summary takes its deterministic path and CI stays offline.
      - name: Full pipeline
        run: python src/run.py

      - name: Upload figures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: figures
          path: outputs/figures/*.png
